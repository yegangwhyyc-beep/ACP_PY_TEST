<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRAE Agent Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f4f5f7; --panel: #fff;
    --user: #4f6ef7; --bot: #eceef3; --bot-text: #1f2329;
    --border: #e2e4ea; --muted: #8f959e; --danger: #ff6b6b; --ok: #34c759;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .app {
    width: 100%; max-width: 720px; height: 94vh;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.06);
  }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .dot.online { background: var(--ok); } .dot.offline { background: var(--danger); }
  .status { font-size: 12px; color: var(--muted); margin-left: auto; text-align: right; }
  .status code { font-size: 11px; color: var(--muted); }
  button.act {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  button.act:hover { border-color: var(--user); color: var(--user); }
  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; } .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bot); color: var(--bot-text); border-bottom-left-radius: 4px; }
  .bubble.error { background: #fdecec; color: #c0392b; }
  .bubble.typing { opacity: .7; font-style: italic; }
  details.extra { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details.extra summary { cursor: pointer; user-select: none; }
  details.extra .items { margin-top: 6px; padding: 8px 10px; background: #f6f7f9; border-radius: 8px;
    max-height: 180px; overflow-y: auto; }
  details.extra .items div { padding: 2px 0; line-height: 1.5; }
  footer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); }
  footer input[type=text] {
    flex: 1; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 14px; outline: none;
  }
  footer input[type=text]:focus { border-color: var(--user); }
  footer button {
    padding: 10px 22px; border: none; border-radius: 10px;
    background: var(--user); color: #fff; font-size: 14px; cursor: pointer;
  }
  footer button:hover { opacity: .9; }
  footer button:disabled { opacity: .5; cursor: not-allowed; }
  .settings { display: flex; align-items: center; gap: 6px; padding: 8px 18px; border-bottom: 1px solid var(--border); }
  .settings label { font-size: 12px; color: var(--muted); }
  .settings input {
    flex: 1; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; outline: none; font-family: monospace;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div id="dot" class="dot"></div>
    <h1>TRAE Agent Chat</h1>
    <span id="status" class="status">连接中…</span>
    <button id="reset-btn" class="act" title="调用 POST /api/session/reset 开启全新会话">新会话</button>
  </header>

  <div class="settings">
    <label for="api-base">API 地址</label>
    <input id="api-base" type="text" spellcheck="false" />
  </div>

  <main id="messages"></main>

  <footer>
    <input id="input" type="text" placeholder="输入消息，回车发送…" autocomplete="off" autofocus />
    <button id="send-btn">发送</button>
  </footer>
</div>

<script>
"use strict";

// ===== 配置 =====
const DEFAULT_BASE = "http://127.0.0.1:8300";
const apiBaseInput = document.getElementById("api-base");
const messagesEl  = document.getElementById("messages");
const inputEl     = document.getElementById("input");
const sendBtn     = document.getElementById("send-btn");
const resetBtn    = document.getElementById("reset-btn");
const statusEl    = document.getElementById("status");
const dotEl       = document.getElementById("dot");

// API 地址可改，持久化到 localStorage
apiBaseInput.value = localStorage.getItem("trae_api_base") || DEFAULT_BASE;
let API_BASE = apiBaseInput.value.replace(/\/+$/, "");
apiBaseInput.addEventListener("change", () => {
  API_BASE = apiBaseInput.value.trim().replace(/\/+$/, "");
  localStorage.setItem("trae_api_base", API_BASE);
  checkHealth();
});

// ===== 健康检查：GET /api/health =====
async function checkHealth() {
  try {
    const res = await fetch(`${API_BASE}/api/health`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const h = await res.json();
    dotEl.className = "dot " + (h.connected ? "online" : "offline");
    statusEl.innerHTML = h.connected
      ? `已连接 traecli · 协议 v${h.protocol_version}<br/><code>会话 ${short(h.session_id)}</code>`
      : `服务在线，但 traecli 未连接`;
  } catch {
    dotEl.className = "dot offline";
    statusEl.textContent = "服务不可达（先启动 trae_http.py）";
  }
}
function short(id) { return id ? id.slice(0, 13) + "…" : "-"; }
checkHealth();
setInterval(checkHealth, 15000);

// ===== 渲染 =====
function addBubble(text, role, cls) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = `bubble${cls ? " " + cls : ""}`;
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addExtras(bubble, thoughts, toolEvents) {
  if ((!thoughts || !thoughts.length) && (!toolEvents || !toolEvents.length)) return;
  const details = document.createElement("details");
  details.className = "extra";
  const parts = [];
  if (thoughts && thoughts.length) parts.push(`思考过程 (${thoughts.length})`);
  if (toolEvents && toolEvents.length) parts.push(`工具调用 (${toolEvents.length})`);
  const summary = document.createElement("summary");
  summary.textContent = parts.join(" · ");
  const box = document.createElement("div");
  box.className = "items";
  (thoughts || []).forEach(t => { const d = document.createElement("div"); d.textContent = "💭 " + t; box.appendChild(d); });
  (toolEvents || []).forEach(t => { const d = document.createElement("div"); d.textContent = "🔧 " + t; box.appendChild(d); });
  details.appendChild(summary);
  details.appendChild(box);
  bubble.appendChild(details);
  bubble.style.whiteSpace = "normal";
}

// ===== 发送：POST /api/chat =====
let busy = false;
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  inputEl.value = "";
  addBubble(text, "user");

  const typing = addBubble("思考中…", "assistant", "typing");
  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    typing.classList.remove("typing");
    typing.textContent = data.reply || "(空回复)";
    addExtras(typing, data.thoughts, data.tool_events);
  } catch (err) {
    typing.classList.remove("typing");
    typing.classList.add("error");
    typing.textContent = "请求失败：" + err.message;
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
    checkHealth();
  }
}

// ===== 新会话：POST /api/session/reset =====
resetBtn.addEventListener("click", async () => {
  if (busy) return;
  try {
    const res = await fetch(`${API_BASE}/api/session/reset`, { method: "POST" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    messagesEl.innerHTML = "";
    addBubble("已开启新会话，上下文已清空。", "assistant");
    checkHealth();
  } catch (err) {
    addBubble("新会话创建失败：" + err.message, "assistant", "error");
  }
});

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

addBubble("你好，我是 TRAE Agent（通过 traecli ACP 接入）。确保 trae_http.py 已在运行，然后随便聊点什么吧。", "assistant");
</script>
</body>
</html>
