<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Agent</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="dot"></div>
      <h1>Chat Agent</h1>
      <span id="api-status" class="status">检查后端中…</span>
    </header>

    <main id="messages" class="chat-messages">
      <div class="message assistant">
        <div class="bubble">你好，我是 Chat Agent。后端逻辑暂未实现，当前为 Mock 模式，随便聊点什么吧。</div>
      </div>
    </main>

    <footer class="chat-input">
      <input
        id="input"
        type="text"
        placeholder="输入消息，回车发送…"
        autocomplete="off"
        autofocus
      />
      <button id="send-btn">发送</button>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
